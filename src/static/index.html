<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Planning System</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Typography: Libre Baskerville (display) + Source Sans 3 (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- External Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

    <!-- Leaflet for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/feedback-tracking.css">

    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <img src="/rps-logo.svg" alt="RPS" style="height: 40px;">
                </div>
            </div>
            <div class="user-info-badge" id="user-profile-display">
                <span>👤</span>
                <span id="header-username">...</span>
                <span id="header-profile-separator" style="display: none; opacity: 0.4; margin: 0 4px;">•</span>
                <span id="header-profile-name" style="display: none; opacity: 0.8;"></span>
            </div>
            <div class="header-buttons">
                <button class="setup-btn" id="setup-btn" style="display: none;">
                    <span class="setup-icon">📋</span>
                    <span class="setup-text">Complete Setup</span>
                    <span class="setup-badge">0%</span>
                </button>
                <button class="feedback-btn" id="feedback-btn">
                    <span>💬</span>
                    <span>Feedback</span>
                </button>
                <button class="settings-btn" id="settings-btn">
                    <span>⚙️</span>
                    <span>Settings</span>
                </button>
                <button class="logout-btn" id="logout-btn">
                    <span>🚪</span>
                    <span>Logout</span>
                </button>
            </div>
        </header>

        <div class="tabs" id="tabs-container">
            <!-- Start Group (Standalone for quick access) -->
            <button class="tab active" data-tab="welcome">✨ Welcome</button>
            <button class="tab" data-tab="dashboard">Dashboard</button>

            <!-- Data Input Group -->
            <div class="nav-group">
                <div class="nav-group-label">
                    📝 Data <span style="font-size: 10px;">▼</span>
                </div>
                <div class="nav-dropdown">
                    <button class="tab" data-tab="profile">👤 Personal Profile</button>
                    <button class="tab" data-tab="income">💵 Income</button>
                    <button class="tab" data-tab="expenses">💸 Expenses</button>
                    <button class="tab" data-tab="assets">💰 Assets</button>
                </div>
            </div>

            <!-- Analysis & Strategy Group -->
            <div class="nav-group">
                <div class="nav-group-label">
                    📈 Analysis <span style="font-size: 10px;">▼</span>
                </div>
                <div class="nav-dropdown">
                    <button class="tab" data-tab="cashflow">💸 Cash Flow View</button>
                    <button class="tab" data-tab="analysis">📊 Monte Carlo Projections</button>
                    <button class="tab" data-tab="comparison">⚖️ Compare Scenarios</button>
                    <button class="tab" data-tab="tax">🏛️ Tax Optimization</button>
                    <button class="tab" data-tab="withdrawal">🔄 Withdrawal Strategy</button>
                </div>
            </div>

            <!-- Resources Group -->
            <div class="nav-group">
                <div class="nav-group-label">
                    📚 Resources <span style="font-size: 10px;">▼</span>
                </div>
                <div class="nav-dropdown">
                    <button class="tab" data-tab="actions">✅ Action Items</button>
                    <button class="tab" data-tab="advisor">🤖 AI Advisor</button>
                    <button class="tab" data-tab="summary">📄 PDF Report</button>
                    <button class="tab" data-tab="learn">📖 Knowledge Base</button>
                </div>
            </div>

            <!-- Admin (Hidden) -->
            <button class="tab admin-only-tab" data-tab="admin" style="display: none;">⚙️ Admin</button>
        </div>

        <!-- Tab Contents (loaded dynamically) -->
        <div id="tab-content-container"></div>

        <!-- Modals Container -->
        <div id="modals-container"></div>

        <!-- Footer -->
        <footer style="text-align: center; padding: 20px; color: var(--text-secondary); font-size: 12px; border-top: 1px solid var(--border-color); margin-top: 40px;">
            <p style="margin: 0;">
                RPS <span id="app-version">...</span> - pan
                <span style="margin: 0 8px;">|</span>
                <a href="#" id="view-roadmap-link" style="color: var(--accent-color); text-decoration: none;">View Roadmap</a>
            </p>
        </footer>
    </div>

    <!-- ES6 Module Entry Point -->
    <script type="module" src="/js/main.js?v=3.9.167"></script>
</body>
</html>
