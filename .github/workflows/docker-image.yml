name: Build & Publish Docker Image (GHCR)

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also tag/push :latest"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rps

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the git tag when building releases, otherwise fall back to version.json.
          ref="${GITHUB_REF_NAME:-}"
          if [[ "$ref" == v*.*.* ]]; then
            ver="${ref#v}"
          else
            ver="$(python -c 'import json; print(json.load(open(\"src/static/version.json\"))[\"version\"])')"
          fi

          echo "version=$ver" >>"$GITHUB_OUTPUT"

          tags=()
          tags+=("${IMAGE_NAME}:${ver}")
          tags+=("${IMAGE_NAME}:v${ver}")

          if [[ "${{ github.event_name }}" == "push" ]]; then
            # For tagged releases, also update :latest.
            tags+=("${IMAGE_NAME}:latest")
          else
            if [[ "${{ inputs.push_latest }}" == "true" ]]; then
              tags+=("${IMAGE_NAME}:latest")
            fi
          fi

          (IFS=,; echo "tags=${tags[*]}") >>"$GITHUB_OUTPUT"
          echo "Will publish tags: ${tags[*]}"

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

