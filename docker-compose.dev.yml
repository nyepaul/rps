services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rps_redis:/data

  rps:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - redis
    ports:
      - "127.0.0.1:${RPS_HOST_PORT:-5137}:5137"
    environment:
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - PORT=5137
      - REDIS_URL=redis://redis:6379
      - RATELIMIT_ENABLED=true
      - SECRET_KEY=${SECRET_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - BACKUP_KEY_PEPPER=${BACKUP_KEY_PEPPER:-}
      - SESSION_COOKIE_SECURE=false
      - APP_BASE_URL=http://127.0.0.1:${RPS_HOST_PORT:-5137}
      - RPS_REQUIRE_EMAIL_VERIFICATION=false
      - RPS_AUTO_SECRETS=true
      - RPS_SEED_DEMO=true
      - RPS_DROP_PRIVS=true
    volumes:
      - rps_data:/app/data
      - rps_logs:/app/logs
      - rps_backups:/app/backups
    restart: unless-stopped

volumes:
  rps_data:
  rps_logs:
  rps_backups:
  rps_redis:
